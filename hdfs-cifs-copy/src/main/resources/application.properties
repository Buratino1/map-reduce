db.url=jdbc:mysql://localhost:3306/catalyst_db?useSSL=false
db.user=catalyst
db.pass=changeme

lock.workflow=hdfs-cifs-copy
lock.type=X

# HDFS folder where restored data lands (prefixed to the original source path).
# Must be writable by the user running the tool: /user/<name>/... works without
# admin rights; a root-level folder like /restored needs to be pre-created and
# chowned by an HDFS admin.
restore.prefix=/user/catalyst/restored

# Extra non-numeric impala.prod ext folders included in --dynamic mode
ext.extra=FI,IT,SE
